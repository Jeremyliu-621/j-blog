<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section id="art-page">
      <div class="title">
        <h1>Art I Appreciate</h1>
      </div>
      <div class="content">
        <div class="back-to-home">
          <a href="/">Back to home</a>
        </div>
        <div class="art-images">
          <div class="art-image" id="spiderverse">
            <img src="./art-assets/spiderverse.jpg" alt="Spiderverse" />
            <p>Into the Spiderverse</p>
          </div>
          <div class="art-image" id="beetlemoses">
            <img src="./art-assets/beetlemoses.jpg" alt="Beetle Moses" />
            <p>@beetlemoses</p>
          </div>
          <div class="art-image" id="sunflowers">
            <img src="./art-assets/sunflowers.jpg" alt="Sunflowers" />
            <p>Sunflowers - Van Gogh</p>
          </div>
          <div class="art-image" id="zephyr">
            <img src="./art-assets/zephyr_tag.jpg" alt="Zephyr" />
            <p>Zephyr's Tag</p>
          </div>
          <div class="art-image" id="drool">
            <img src="./art-assets/drool.jpg" alt="Drool" />
            <p>All Contemporary Art collected by DROOL</p>
          </div>
          <div class="art-image" id="Jesus">
            <img src="./art-assets/Jesus.jpg" alt="Jesus" />
            <p>Jesus Walks on Water - Ivan Aivazovsky</p>
          </div>
          <div class="art-image" id="anna">
            <img src="./art-assets/annalauraart.PNG" alt="Anna Laura Art" />
            <p>Anna Laura Art</p>
          </div>
        </div>
      </div>
    </section>
    <script src="js/index.js"></script>
  </body>
</html>
